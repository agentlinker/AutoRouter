templates:
  - template_id: bigmodel-paas-cn
    vendor_id: bigmodel
    vendor_name: 智谱 BigModel
    product_line: 开放平台 PaaS
    region: cn
    display_name: 智谱官方
    suggested_provider_key: bigmodel-official-api
    website_url: https://bigmodel.cn
    docs_url: https://docs.bigmodel.cn
    provider_kind: official
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: https://open.bigmodel.cn/api/paas/v4/
      - endpoint_key: anthropic-messages
        protocol: anthropic-messages
        base_url: https://open.bigmodel.cn/api/anthropic
    notes: 2026-09-06 按官方 Chat Completions 与 Claude API 兼容文档确认。

  - template_id: xiaomi-mimo-token-plan-cn
    vendor_id: xiaomi-mimo
    vendor_name: 小米 MiMo
    product_line: Token Plan
    region: cn
    display_name: Xiaomi Token Plan CN
    suggested_provider_key: xiaomi-token-plan-cn
    website_url: https://token-plan-cn.xiaomimimo.com
    docs_url: https://platform.mimo.mi.com/docs/overview.html
    provider_kind: official
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: https://token-plan-cn.xiaomimimo.com/v1
      - endpoint_key: anthropic-messages
        protocol: anthropic-messages
        base_url: https://token-plan-cn.xiaomimimo.com/anthropic
    notes: 2026-09-06 按官方 Token Plan 示例确认 Chat Completions 与 Anthropic Messages；未确认的 SGP 独立 URL 不提供预设。

  - template_id: volcengine-ark-coding-cn-beijing
    vendor_id: volcengine
    vendor_name: 火山引擎
    product_line: 方舟 Ark Coding
    region: cn-beijing
    display_name: Volcengine Ark Coding
    suggested_provider_key: volcengine-ark-coding
    website_url: https://www.volcengine.com/product/ark
    docs_url: https://www.volcengine.com/docs/82379/1928261
    provider_kind: official
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: https://ark.cn-beijing.volces.com/api/coding/v3
      - endpoint_key: anthropic-messages
        protocol: anthropic-messages
        base_url: https://ark.cn-beijing.volces.com/api/coding
    notes: 2026-09-06 按火山引擎官方 Coding Plan 文档确认两种协议入口。

  - template_id: longcat-official
    vendor_id: longcat
    vendor_name: LongCat
    product_line: Official API
    display_name: LongCat
    suggested_provider_key: longcat
    website_url: https://longcat.chat
    docs_url: https://longcat.chat/platform/docs/zh-CN/advanced-settings/anthropic-api.html
    provider_kind: official
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: https://api.longcat.chat/openai
      - endpoint_key: anthropic-messages
        protocol: anthropic-messages
        base_url: https://api.longcat.chat/anthropic
    notes: 2026-09-06 按 LongCat 官方 OpenAI 与 Anthropic API 文档确认。

  - template_id: openrouter
    vendor_id: openrouter
    vendor_name: OpenRouter
    product_line: 聚合平台
    display_name: OpenRouter
    suggested_provider_key: openrouter
    website_url: https://openrouter.ai
    docs_url: https://openrouter.ai/docs/api/reference/overview
    provider_kind: relay
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: https://openrouter.ai/api/v1
        custom_headers:
          x-title: autorouter
          http-referer: https://autorouter.local
      - endpoint_key: openai-responses
        protocol: openai-responses
        base_url: https://openrouter.ai/api/v1
        custom_headers:
          x-title: autorouter
          http-referer: https://autorouter.local
    notes: 2026-09-06 按 OpenRouter 官方 Chat Completions 与 Responses 文档确认。

  - template_id: ollama-local
    vendor_id: ollama
    vendor_name: Ollama
    product_line: 本地运行时
    display_name: Local Ollama
    suggested_provider_key: local-ollama
    website_url: https://ollama.com
    docs_url: https://docs.ollama.com/openai
    provider_kind: custom
    endpoints:
      - endpoint_key: openai-chat-completions
        protocol: openai-chat-completions
        base_url: http://127.0.0.1:11434/v1
      - endpoint_key: openai-responses
        protocol: openai-responses
        base_url: http://127.0.0.1:11434/v1
    notes: 2026-09-06 按 Ollama 官方 OpenAI compatibility 文档确认 Chat Completions 与 Responses。
