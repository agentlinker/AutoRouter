server:
  host: 127.0.0.1
  port: 8811
  request_timeout_ms: 120000
  # ~2M tokens * ~4 bytes/token ≈ 8 MiB; raises Fastify 413 when exceeded
  body_limit_bytes: 8388608
  gateway_token_env: AUTO_ROUTER_TOKEN
  admin_token_env: AUTO_ROUTER_ADMIN_TOKEN

database:
  path: ./data/autorouter.db

defaults:
  model: auto
  policy: balanced
  privacy_level: normal

trace:
  directory: ./data/traces
  hot_retention_days: 7
  log_prompts: false
  archive:
    format: parquet
    directory: ./data/traces
    flush_batch_size: 100

policies:
  balanced:
    min_trust_level: low
    allow_public_only_provider: false
    fallback_enabled: true
    sticky_session: true

# Providers 和 Routes 通过 Admin UI 管理，无需在此配置。
# 如需通过 YAML 静态配置 provider，参考文档中的 provider-centered 简写格式。
